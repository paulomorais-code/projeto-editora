# Nginx — Nascente em produção (site estático + API + painel protegido)
# TLS: gere os certificados com certbot e aponte para nginx/certs/.

# Redireciona todo HTTP para HTTPS (comente durante a emissão do certbot webroot)
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Segurança de borda (complementa o Helmet da API)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1) Painel do editor: SÓ da sua rede/VPN — ajuste o IP antes de subir!
    location /admin/ {
        allow 203.0.113.10;        # SEU_IP_AQUI
        allow 127.0.0.1;
        deny all;
        proxy_pass http://app:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) API (catálogo, pedidos, webhook do Mercado Pago)
    location /api/ {
        proxy_pass http://app:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # upload de capas (10 MB + folga)
    }

    # 3) Site estático (raiz do repositório montada em ./site)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
        # HTML sempre revalidado; assets versionados (?) podem ter cache longo
        add_header Cache-Control "no-cache";
        location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
